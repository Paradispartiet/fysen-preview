name: Trigger Fysen preview now

# One-shot retry after cleanup.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-preview-now.yml

permissions:
  actions: write
  contents: write

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preview deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --ref main
          printf 'triggered\nrun=%s\n' "$GITHUB_RUN_ID" > /tmp/triggered
          encoded="$(base64 -w0 /tmp/triggered)"
          current="$(gh api "repos/${GITHUB_REPOSITORY}/contents/.preview-triggered.txt?ref=main" --jq .sha 2>/dev/null || true)"
          args=(--method PUT "repos/${GITHUB_REPOSITORY}/contents/.preview-triggered.txt" -f message="Record preview trigger ${GITHUB_RUN_ID}" -f content="$encoded" -f branch=main)
          if [[ -n "$current" ]]; then args+=(-f sha="$current"); fi
          gh api "${args[@]}" >/dev/null

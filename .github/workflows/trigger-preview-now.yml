name: Trigger Fysen preview now

# One-shot retry after cleanup.
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/trigger-preview-now.yml

permissions:
  actions: write
  contents: read

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger preview deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

name: Deploy Fysen preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fysen-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch compiled Fysen preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site preview.zip
          mkdir -p _site
          curl --fail --location --retry 3 --output preview.zip 'https://sdmntprnortheu.oaiusercontent.com/files/00000000-2564-81f4-824e-688eaae863ae/raw?se=2026-08-17T19%3A57%3A14Z&sp=r&sv=2026-02-06&sr=b&scid=1a1fb38f-7385-5c7c-82f1-97beceac8cbc&skoid=82a3371f-2f6c-4f81-8a78-2701b362559b&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T06%3A55%3A05Z&ske=2026-08-18T06%3A55%3A05Z&sks=b&skv=2026-02-06&sig=9BFEybL1IO5BvHGbTN%2BhnzloDh99ImagPzj2cJGP4kY%3D'
          unzip -q preview.zip -d _site
          test -f _site/index.html
          test -f _site/search/index.html
          test -d _site/_next
          test -f _site/source-main-sha.txt
          test "$(cat _site/source-main-sha.txt)" = "6ec27c1449c264226bd4d9bdc8c320959cb92544"
          touch _site/.nojekyll
          echo "Publishing private-main build $(cat _site/source-main-sha.txt)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy Fysen preview

on:
  workflow_dispatch:
  repository_dispatch:
    types: [publish-fysen-preview]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fysen-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout published snapshot
        uses: actions/checkout@v4
        with:
          ref: site

      - name: Verify published snapshot
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SOURCE_SHA: ${{ github.event.client_payload.source_sha }}
        run: |
          set -euo pipefail
          test -f index.html
          test -f search/index.html
          test -d _next
          test -f source-main-sha.txt
          test -f brand/fysen-mark.webp

          actual_source_sha="$(cat source-main-sha.txt)"
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            test -n "$EXPECTED_SOURCE_SHA"
            test "$actual_source_sha" = "$EXPECTED_SOURCE_SHA"
          fi

          touch .nojekyll
          echo "Publishing Fysen preview from private main $actual_source_sha"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

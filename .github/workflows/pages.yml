name: Deploy Fysen preview

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pages.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: fysen-preview-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch compiled Fysen preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site preview.zip
          mkdir -p _site
          curl --fail --location --retry 3 --output preview.zip 'https://sdmntprindiasocentral.oaiusercontent.com/files/00000000-2934-8211-9eab-e263318be8d1/raw?se=2026-08-17T16%3A57%3A17Z&sp=r&sv=2026-02-06&sr=b&scid=7c96fcc5-a83d-521f-abe7-6215dec353f7&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-17T08%3A24%3A43Z&ske=2026-08-18T08%3A24%3A43Z&sks=b&skv=2026-02-06&sig=q17DF9baKHkRhSGTfMOXcjqOSgSIHZ2ib3bqjFlgNJo%3D'
          unzip -q preview.zip -d _site
          test -f _site/index.html
          test -d _site/_next
          test -f _site/source-main-sha.txt
          test "$(cat _site/source-main-sha.txt)" = "ce2b1b9ec054ec25db40a4c8d514cbb03ab92aaa"
          touch _site/.nojekyll
          echo "Publishing private-main build $(cat _site/source-main-sha.txt)"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

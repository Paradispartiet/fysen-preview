name: Cleanup restored preview branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cleanup-restoration-branches.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete obsolete restoration branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branches=(
            agent/preview-deploy-resilient
            agent/retry-preview-now
            agent/verify-restored-preview-2026-08-18
          )
          for branch in "${branches[@]}"; do
            if gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${branch}" >/dev/null 2>&1; then
              gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
              echo "Deleted $branch"
            fi
          done

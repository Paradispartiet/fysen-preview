<!doctype html>
<html lang="nb">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Fysen — Design v2 preview</title>
  <meta name="description" content="Statisk forhåndsvisning av Fysen Design v2." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:#090b09; --surface:#101510; --surface2:#151c16; --surface3:#1b241c;
      --ink:#f1f4ef; --muted:#abb3aa; --soft:#7e897f; --line:rgba(159,184,162,.16);
      --green:#79c987; --green2:#8bd999; --greenSoft:rgba(121,201,135,.14); --terracotta:#c96c48;
      --max:1200px; --hero:1040px;
    }
    *{box-sizing:border-box} html{background:var(--bg);color-scheme:dark;min-height:100%}
    body{margin:0;min-height:100vh;background:radial-gradient(circle at 78% 24%,rgba(49,88,58,.16),transparent 30%),var(--bg);color:var(--ink);font-family:"DM Sans",ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
    a{color:inherit}.header{width:100%}.header-inner{width:min(var(--max),100%);margin:auto;padding:25px 40px;display:flex;align-items:center;justify-content:space-between;gap:24px}
    .logo{font-size:34px;font-weight:700;letter-spacing:-.045em;text-decoration:none}.city{font-size:15px;font-weight:600;color:var(--muted)}
    main{padding-bottom:82px}.hero{width:min(var(--hero),calc(100% - 80px));margin:0 auto;min-height:610px;padding:74px 0 58px;display:grid;grid-template-columns:minmax(0,1fr) 310px;align-items:center;gap:34px;position:relative}
    h1{margin:0;max-width:660px;font-size:clamp(70px,7.2vw,92px);font-weight:640;line-height:1.01;letter-spacing:-.026em}h1 span{display:block}
    .hero-art{align-self:center;position:relative;display:grid;place-items:center;min-height:330px}.hero-art:before{content:"";position:absolute;width:295px;height:295px;border-radius:50%;background:radial-gradient(circle,rgba(121,201,135,.10),transparent 68%);filter:blur(2px)}
    .hero-art svg{width:330px;max-width:100%;position:relative;filter:drop-shadow(0 22px 50px rgba(0,0,0,.25))}.ink{stroke:rgba(241,244,239,.48);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}.green{stroke:var(--green);stroke-width:3.3;stroke-linecap:round;stroke-linejoin:round}.accent{stroke:var(--terracotta);stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
    .search-wrap{margin-top:38px;width:min(820px,calc(100% + 310px))}.search{min-height:76px;padding:7px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(145deg,#101510,#0d120e);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;box-shadow:0 14px 42px rgba(0,0,0,.28);transition:border-color .16s,box-shadow .16s}.search:focus-within{border-color:rgba(121,201,135,.48);box-shadow:0 16px 46px rgba(0,0,0,.30),0 0 0 2px rgba(121,201,135,.13)}
    .field{min-width:0;display:flex;align-items:center;gap:12px;padding:0 18px}.field svg{width:22px;height:22px;stroke:var(--soft);stroke-width:1.8;flex:none}.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;font-size:18px;font-weight:450}.field input::placeholder{color:var(--soft)}
    .search button{border:0;border-radius:13px;min-width:146px;padding:0 22px;background:var(--green);color:#071008;font:inherit;font-size:16px;font-weight:700;cursor:pointer;transition:background .16s,transform .16s}.search button:hover{background:var(--green2);transform:translateY(-1px)}
    .proof{margin:15px 3px 0;color:var(--muted);font-size:14px;line-height:1.45}.proof:before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--green);margin:0 10px 2px 0}
    .suggestions{width:min(var(--hero),calc(100% - 80px));margin:0 auto;padding:25px;border:1px solid var(--line);border-radius:20px;background:linear-gradient(145deg,rgba(16,21,16,.96),rgba(21,28,22,.92))}
    .suggest-head{display:flex;justify-content:space-between;align-items:end;gap:28px;margin-bottom:20px}.eyebrow{margin:0 0 6px;color:var(--green);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}.suggest-head h2{margin:0;font-size:29px;font-weight:640;letter-spacing:-.022em;line-height:1.08}.suggest-head>p{margin:0;color:var(--muted);font-size:14px;line-height:1.45;text-align:right;max-width:310px}
    .cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.card{min-height:145px;padding:18px;border:1px solid rgba(121,201,135,.14);border-radius:16px;background:rgba(27,36,28,.74);text-decoration:none;display:flex;flex-direction:column;align-items:flex-start;gap:12px;transition:border-color .16s,background .16s,transform .16s}.card:hover{transform:translateY(-2px);background:var(--surface3);border-color:rgba(121,201,135,.36)}.card small{color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.09em}.card strong{margin-top:auto;font-size:22px;font-weight:640;letter-spacing:-.02em}.action{font-size:13px;font-weight:650;color:var(--green)}
    .sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:900px){.hero{grid-template-columns:minmax(0,1fr) 240px;min-height:570px}.hero-art svg{width:250px}.search-wrap{width:calc(100% + 240px)}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:767px){.header-inner{padding:20px}.logo{font-size:29px}.hero{width:calc(100% - 40px);grid-template-columns:minmax(0,1fr) 150px;min-height:510px;padding:52px 0 44px;align-items:start}.hero-art{min-height:180px;margin-top:-12px}.hero-art svg{width:180px;transform:translateX(15px)}h1{font-size:clamp(50px,12vw,60px);line-height:1.03}.search-wrap{width:calc(100% + 150px);margin-top:30px}.suggestions{width:calc(100% - 40px);padding:22px}.suggest-head{align-items:flex-start;flex-direction:column;gap:8px}.suggest-head>p{text-align:left}.cards{display:flex;overflow-x:auto;scroll-snap-type:x proximity;margin-right:-22px;padding-right:22px}.card{min-width:190px;scroll-snap-align:start}}
    @media(max-width:520px){.hero{display:block;min-height:0}.hero-art{position:absolute;right:-34px;top:2px;width:145px;min-height:0;opacity:.9}.hero-art svg{width:145px;transform:none}.hero-content{padding-right:50px}h1{font-size:clamp(48px,14vw,58px)}.search-wrap{width:calc(100vw - 40px)}.search{grid-template-columns:1fr;gap:7px}.field{min-height:54px}.search button{min-height:52px}.suggestions{margin-top:12px}}
  </style>
</head>
<body>
  <header class="header"><div class="header-inner"><a class="logo" href="./" aria-label="Fysen forsiden">fysen.</a><span class="city">Oslo</span></div></header>
  <main>
    <section class="hero" aria-labelledby="title">
      <div class="hero-content">
        <h1 id="title"><span>Hva har du</span><span>lyst på?</span></h1>
        <div class="search-wrap">
          <form class="search" action="https://fysen.vercel.app/search" method="get">
            <label class="sr" for="q">Retten du vil spise</label>
            <div class="field"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg><input id="q" name="q" type="search" placeholder="Biff tartar, ramen, carbonara …" autocomplete="off" /></div>
            <input type="hidden" name="city" value="Oslo" /><button type="submit">Finn retten</button>
          </form>
          <p class="proof">Søk i ferske, sporbare restaurantmenyer.</p>
        </div>
      </div>
      <div class="hero-art" aria-hidden="true"><svg viewBox="0 0 420 360" fill="none"><g class="ink"><path d="M82 188c10 74 62 116 128 116s118-42 128-116H82Z"/><path d="M98 188c28 14 68 22 112 22s84-8 112-22"/><path d="M126 158c18-36 43-49 65-28 18 17 28 43 53 40 24-3 35-34 67-44"/><path d="M130 175c19-27 39-34 58-18 19 16 30 28 50 26 22-2 36-23 65-30"/><path d="M149 116c-12-18-7-37 8-51M205 109c-11-18-5-36 10-50M263 115c-11-17-6-35 9-49"/><path d="M104 235c34 23 68 34 106 34s73-11 106-34"/></g><g class="green"><path d="M113 139c-25-24-44-30-58-17 19 7 34 19 43 36"/><path d="M298 117c28-19 51-19 66-3-21 3-39 13-52 29"/><path d="M180 135c-9-24-3-45 17-62 4 25 1 44-9 58"/><circle cx="151" cy="149" r="8"/><circle cx="280" cy="151" r="7"/></g><g class="accent"><path d="M306 99 353 52M325 111l45-45"/><path d="M91 269c-21 10-34 24-39 43"/></g></svg></div>
    </section>
    <section class="suggestions" aria-labelledby="suggest-title"><div class="suggest-head"><div><p class="eyebrow">Matlyst</p><h2 id="suggest-title">Forslag akkurat nå</h2></div><p>Snarveier til retter du kan søke etter.</p></div><div class="cards">
      <a class="card" href="https://fysen.vercel.app/search?q=ramen&city=Oslo"><small>Forslag</small><strong>Ramen</strong><span class="action">Finn retten →</span></a>
      <a class="card" href="https://fysen.vercel.app/search?q=tartar&city=Oslo"><small>Forslag</small><strong>Tartar</strong><span class="action">Finn retten →</span></a>
      <a class="card" href="https://fysen.vercel.app/search?q=fried%20chicken&city=Oslo"><small>Forslag</small><strong>Fried chicken</strong><span class="action">Finn retten →</span></a>
      <a class="card" href="https://fysen.vercel.app/search?q=pizza&city=Oslo"><small>Forslag</small><strong>Pizza</strong><span class="action">Finn retten →</span></a>
    </div></section>
  </main>
</body>
</html>
